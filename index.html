<head><script>
(() => {
    if (!new URLSearchParams(location.search).has("twplib")) return;

    const targetUrl = location.origin + location.pathname;

    const handler = `
        <!-- placeholders exactly 10 chars long -->
        const INDEX_START = '0000182453';
        const INDEX_END = '0000183208';
        <!-- cache hash placeholder is 13 chars long -->
        const CACHE_HASH = '1788930783136';
        const T = ${JSON.stringify(targetUrl)};
        const _SK = \`twplib-idx:\${T}:\${CACHE_HASH}\`;
        
        let _i = null;

        try {
            for (const k of Object.keys(sessionStorage)) {
                if (k.startsWith(\`twplib-idx:\${T}\`) && k !== _SK) {
                    sessionStorage.removeItem(k);
                }
            }
        } catch (e) {}

        const fi = async () => {
            if (_i) return _i;

            try {
                const c = sessionStorage.getItem(_SK);
                if (c) {
                    const j = JSON.parse(c);
                    if (j?.data) {
                        _i = j;
                        return _i;
                    }
                    sessionStorage.removeItem(_SK);
                }
            } catch (e) {}

            const start = parseInt(INDEX_START, 10);
            const end = parseInt(INDEX_END, 10);
            
            const response = await fetch(\`\${T}?_=\${CACHE_HASH}\`, { 
                headers: { Range: \`bytes=\${start}-\${end}\` },
                cache: "no-store"
            });
            
            if (response.status !== 206) {
                throw new Error(\`Server does not support Range Requests (got \${response.status})\`);
            }
            
            const j = await response.json();
            
            try {
                sessionStorage.setItem(_SK, JSON.stringify(j));
            } catch (e) {}
            
            _i = j;
            return j;
        };

        const fp = (idx, title) => {
            const ti = idx.keys.indexOf('title');
            const row = idx.data.find(r => r[ti] === title);
            
            if (!row) return null;
            
            return idx.keys.reduce((acc, key, i) => {
                if (row[i] != null) acc[key] = row[i];
                return acc;
            }, {});
        };

        const tp = (idx) => {
            return idx.data.map(row => 
                idx.keys.reduce((acc, key, i) => {
                    if (row[i] != null) acc[key] = row[i];
                    return acc;
                }, {})
            );
        };

        const sr = (e, status, body) => {
            if (!e.source) return;
            e.source.postMessage({
                verb: 'GET-RESPONSE',
                status: String(status),
                cookies: e.data.cookies,
                url: e.data.url,
                type: status === 200 ? 'application/json' : 'text/plain',
                body
            }, '*');
        };

        window.addEventListener('message', async (e) => {
            if (e.data?.verb !== 'GET') return;
            
            const u = e.data.url || '';
            
            if (u === 'recipes/library/tiddlers.json') {
                const idx = await fi();
                sr(e, 200, JSON.stringify(tp(idx)));
                
            } else if (u.startsWith('recipes/library/tiddlers/')) {
                let enc = u.slice(25);
                if (enc.endsWith('.json')) enc = enc.slice(0, -5);
                
                const title = decodeURIComponent(enc);
                const idx = await fi();
                const p = fp(idx, title);
                
                if (!p) return sr(e, 404, 'Not found');
                
                const response = await fetch(\`\${T}?_=\${CACHE_HASH}\`, { 
                    headers: { Range: \`bytes=\${p.start}-\${p.end}\` },
                    cache: "no-store" 
                });

                const body = await response.text();
                
                sr(e, 200, body);
            } else {
                sr(e, 404, 'Not found');
            }
        });

        fi();
        parent.postMessage({ verb: 'TWPLIB-READY' }, '*');
    `;

    const blobHtml = `<meta charset="utf-8"><script>\n${handler}\n<${"/"}script>`;

    window.stop();
    window.location.replace(URL.createObjectURL(
        new Blob([blobHtml], { type: "text/html" })
    ));
})();</script>

{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/external-plugins/ControlPanel\":{\"text\":\"\\\\function coreURL()\\n[{$:/config/externalURL/$:/core}]\\n\\\\end\\n\\n\\\\function plugins.externalized() \\n\\\"$:/config/externalURL/\\\"=>prefix\\n[prefix\u003Cprefix>]:filter[get[external]match[yes]]+[removeprefix\u003Cprefix>]\\n:filter[\u003Call-plugins-backed-in>!match[true]]\\n\\\\end\\n\\n\\\\function plugins.filter()\\n\\\"$:/config/externalURL/\\\"=>prefix\\n[prefix\u003Cprefix>]:filter[get[external]match[yes]]+[removeprefix\u003Cprefix>]\\n[has[plugin-type]]\\n-[[$:/plugins/theophile.dev/external-plugins]]\\n\\\\end\\n\\n\\\\function publishFilterConditional()\\n\\\"-[prefix[$:/config/externalURL/]] -[[$:/config/SaveWikiButton/Template]]\\\" :filter[\u003Call-plugins-backed-in>match[true]]\\n\\\\end\\n\\n\\\\define publishFilter()\\n-[function[plugins.externalized]] $(publishFilterConditional)$\\n\\\\end\\n\\n\\\\function plugin.URL()  [\u003CcurrentTiddler>lookup[$:/config/externalURL/]]\\n\\n\\\\procedure edit-external-url()\\n\u003Cp style=\\\"display:flex;gap:.5ch;\\\">\\n\u003Ca title=`open the externalized $(currentTiddler)$` href=\u003C\u003Cplugin.URL>> style=\\\"display:inline-grid;width:2ch;\\\">{{$:/core/images/link}}\u003C/a>\\n\u003C$edit tag=\\\"input\\\" class=\\\"tc-edit-texteditor\\\" tiddler=`$:/config/externalURL/$(currentTiddler)$` placeholder=\\\"externalURL\\\" />\\n\u003C/p>\\n\\\\end\\n\\\\procedure mark-external()\\n\\\\procedure set-save-template-to-offline-external-js()\\n\u003C$action-setfield $tiddler=\\\"$:/config/SaveWikiButton/Template\\\" text=\\\"$:/core/save/offline-external-js\\\"/>\\n\\\\end set-save-template-to-offline-external-js\\n\\\\procedure set-save-template-to-save-all()\\n\u003C$action-setfield $tiddler=\\\"$:/config/SaveWikiButton/Template\\\" text=\\\"$:/core/save/all\\\"/>\\n\\\\end set-save-template-to-save-all\\n\u003C%if [\u003CcurrentTiddler>match[$:/core]] %>\\n\u003C$checkbox\\nfield=\\\"external\\\"\\nchecked=\\\"yes\\\"\\ntiddler=`$:/config/externalURL/$(currentTiddler)$` \\ncheckactions=\u003C\u003Cset-save-template-to-offline-external-js>>\\nuncheckactions=\u003C\u003Cset-save-template-to-save-all>>\\n>externalize\u003C/$checkbox>\\n\u003C%else%>\\n\u003C$checkbox field=\\\"external\\\" checked=\\\"yes\\\" tiddler=`$:/config/externalURL/$(currentTiddler)$`>externalize\u003C/$checkbox>\\n\u003C%endif%>\\n\\\\end mark-external\\n\\n\\\\procedure button-export-external-plugin()\\n\u003C$let \\n  isCore={{{ [\u003CcurrentTiddler>match[$:/core]then[yes]] }}}\\n  isCoreMissing={{{ [\u003CisCore>match[yes]] :filter[[$:/boot/boot.js]is[missing]] }}}\\n  exportTemplate={{{ [\u003CisCore>match[yes]then[$:/core/templates/tiddlywiki5.js]else[$:/plugins/theophile.dev/external-plugins/template]] }}}\\n  fileName={{{ \\n[\u003CisCore>match[yes]then[tiddlywikicore-$(version)$.js]substitute[]]\\n~[[$:/config/externalURL/$(currentTiddler)$]substitute[]get[text]split[/]last[]]\\n~[\u003CcurrentTiddler>addsuffix[.js]]\\n}}}>\\n\u003C$button tooltip=\\\"Export standalone plugin\\\">{{$:/core/images/export-button}}\\n  \u003C%if [\u003CisCoreMissing>match[yes]] %>\\n    \u003C!-- Prevent export if the core is already externalized and missing from the store -->\\n    \u003C$action-sendmessage $message=\\\"tm-notify\\\" $param=\\\"$:/plugins/theophile.dev/external-plugins/templates/toast\\\" message=\\\"The core is currently externalized. Uncheck 'externalize', save, and reload before exporting.\\\" />\\n  \u003C%else%>\\n    \u003C!-- Proceed with normal export -->\\n    \u003C$action-sendmessage $message=\\\"tm-download-file\\\"\\n      $param=\u003C\u003CexportTemplate>>\\n      exportFilter=\u003C\u003CcurrentTiddler>>\\n      json.plugin=\u003C\u003Cjson.plugin>>\\n      filename=\u003C\u003CfileName>>\\n      type=\\\"text/javascript\\\"\\n    />\\n  \u003C%endif%>\\n\u003C/$button>\\n\u003C/$let>\\n\\\\end\\n\\nManage and export external plugins for your wiki. Plugins marked as external will be excluded from your main HTML save filter. Make sure your plugin is available at the corresponding url!\\n\\n\\n\u003Ctable class=\\\"tc-table-100\\\" style=\\\"width:100%; text-align:left;\\\">\\n    \u003Ctr>\\n        \u003Cth>Plugin\u003C/th>\\n        \u003Cth>External URL\u003C/th>\\n        \u003Cth>Externalize\u003C/th>\\n        \u003Cth>Export\u003C/th>\\n    \u003C/tr>\\n    \u003C$list filter=\\\"[plugins.filter[]sort[]] -[[$:/plugins/theophile.dev/external-plugins]]\\\">\\n        \u003Ctr>\\n            \u003Ctd>\\n                \u003C$link>\u003C$text text={{{ [\u003CcurrentTiddler>get[name]] ~[\u003CcurrentTiddler>split[/]last[]] }}}/>\u003C/$link>\u003Cbr>\\n                \u003Csmall class=\\\"tc-muted\\\">\u003C$text text=\u003C\u003CcurrentTiddler>>/>\u003C/small>\\n            \u003C/td>\\n            \u003Ctd>\\n                \u003C\u003Cedit-external-url>>\\n\\n\u003C%if [\u003Cplugins.externalized>match[$:/core]match\u003CcurrentTiddler>] %>\\nExternalizing the $:/core will set the [[save template|$:/config/SaveWikiButton/Template]] to [[$:/core/save/offline-external-js]]. \\n\\nYou can export the core locally or reference the \u003Ca href=`https://tiddlywiki.com/${[\u003Cversion>suffix[prerelease]then[prerelease/]]}$${[[tiddlywikicore-$(version)$.js]substitute[]]}$`>pre-hosted version\u003C/a>.\\n\\n[[Further information|https://tiddlywiki.com/#Using%20the%20external%20JavaScript%20template]]\\n\u003C%endif%>\\n\\n\\n            \u003C/td>\\n            \u003Ctd style=\\\"text-align:center;\\\">\\n                \u003C\u003Cmark-external>>\\n            \u003C/td>\\n            \u003Ctd style=\\\"text-align:center;\\\">\\n                \u003C\u003Cbutton-export-external-plugin>>\\n            \u003C/td>\\n        \u003C/tr>\\n    \u003C/$list>\\n\u003C/table>\\n\\n\u003C$button>\\n  Download fully standalone wiki\\n  \u003C$action-sendmessage \\n    $message=\\\"tm-download-file\\\" \\n    $param=\\\"$:/core/save/all\\\" \\n    filename=\\\"full-wiki.html\\\"\\n    plugins.externalized=\\\"\\\"\\n    all-plugins-backed-in=\\\"true\\\"\\n  />\\n\u003C/$button>\",\"tags\":\"$:/tags/ControlPanel $:/tags/Global\",\"caption\":\"External Plugins\",\"list-after\":\"$:/plugins/theophile.dev/inplace-upgrade/core-url\"},\"$:/plugins/theophile.dev/external-plugins/icon\":{\"text\":\"{{$:/core/images/export-button}}\"},\"$:/plugins/theophile.dev/external-plugins/library\":{\"text\":\"\",\"caption\":\"external-plugins Library\",\"tags\":\"$:/tags/PluginLibrary\",\"url\":\"https://external-plugins.tiddlyhost.com/\"},\"$:/plugins/theophile.dev/external-plugins/readme\":{\"text\":\"> This plugin is not compatible with tiddlywiki bellow v5.4.0\\n\\nThis plugin allows you to decouple your plugins from your wiki, exporting them as standalone JavaScript (`.js`) files. \\n\\nBy externalizing plugins:\\n\\n* Your main `.html` file becomes smaller and saves faster.\\n* The browser can cache the external plugin files independently, saving bandwidth.\\n* You can update your wiki content without re-saving megabytes of static plugin code.\\n\\nThis plugin would not be possible without the work of cdruan: https://cdruan.github.io/tw-external-js/\\n\\n!! Usage\\n\\n# Open the ''Control Panel'' and navigate to the ''External Plugins'' tab.\\n# Locate the plugin you want to externalize in the table.\\n# Type the url where the plugin will be located at (e.g., `./plugins/highlight.js`).\\n# Check the ''Externalize'' box.\\n# Click the ''Export'' button (\u003C$button disabled>{{$:/core/images/export-button}}\u003C/$button>). Your browser will download the `.js` file, rename it if needed to match the url.\\n# Move the downloaded `.js` file at the designated location (e.g the same folder as your TiddlyWiki `.html` file if you used a relative url)\\n# ''Save and reload'' your wiki.\\n\\nUpon saving, TiddlyWiki will remove the plugin from its internal store and on the next load will rely on the external `.js` file to load the plugin.\\n\\n!! Reverting an Externalized Plugin\\n\\nIf you want to bake a plugin back into your wiki:\\n\\n# Uncheck the ''Externalize'' box for that plugin in the Control Panel.\\n# Save the wiki. The plugin will be instantly restored into the HTML file.\\n\\n!! Important Notes\\n\\n* ''File Location'': The exported `.js` files must reside in the same directory as your wiki (or at the path you specified) for the browser to find them. If a file is missing, an error alert will notify you on startup.\\n* ''Compatibility'': This plugin requires a modern browser.\"},\"$:/plugins/theophile.dev/external-plugins/scripts\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/external-plugins/ControlPanel]]\\n\u003C$list filter=\\\"\\n[plugins.externalized[]] \\n-[{$:/config/SaveWikiButton/Template}!match[$:/core/save/all]then[$:/core]]\\\" >\\n\u003C$text text=`\u003Cscript src=\\\"$(plugin.URL)$\\\" onerror=\\\"alert('Error: Cannot load $(currentTiddler)$ located at $(plugin.URL)$');\\\">\u003C/script>` />\\n\u003C/$list>\",\"tags\":\"$:/tags/RawMarkupWikified/TopHead\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/external-plugins/template\":{\"text\":\"\\\\whitespace trim\\n\\n\\\\function field.value() [\u003CexportFilter>get{!!title}]\\n\\n\\\\function json.plugin()\\n\\t\\\"[{}]\\\"=>json\\n\\t[\u003CexportFilter>fields[]]:reduce[\u003Caccumulator>!is[blank]else\u003Cjson>jsonset[0],{!!title},\u003Cfield.value>]\\n\\\\end\\n\\n{\\nconst tw = globalThis.$tw ??= Object.create(null);\\ntw.preloadTiddlers = (tw.preloadTiddlers ?? []).concat(\u003C\u003Cjson.plugin>>);\\n}\",\"tags\":\"\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/external-plugins/templates/toast\":{\"text\":\"\u003C\u003Cmessage>>\",\"tags\":\"\",\"code-body\":\"yes\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme ControlPanel","version":"0.0.11","description":"Externalize your plugins","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/external-plugins"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/http-range-library/assetList\":{\"text\":\"[ℹ️[Share all plugins and themes]]\\n[has[plugin-type]type[application/json]] \\n\\n[ℹ️[Hide default plugins and themes]]\\n-[author[JeremyRuston]] -[[$:/temp/info-plugin]]\\n\\n[ℹ️[Hide deprecated plugins]]\\n-[stability[STABILITY_0_DEPRECATED]]\",\"type\":\"text/vnd.tiddlywiki\",\"revision\":\"0\",\"bag\":\"default\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/http-range-library/bootstrap.js\":{\"text\":\"(() => {\\n    if (!new URLSearchParams(location.search).has(\\\"twplib\\\")) return;\\n\\n    const targetUrl = location.origin + location.pathname;\\n\\n    const handler = `\\n        const INDEX_START = '0000000000';\\n        const INDEX_END = '0000000000';\\n        const CACHE_HASH = '0000000000000';\\n        const T = ${JSON.stringify(targetUrl)};\\n        const _SK = \\\\`twplib-idx:\\\\${T}:\\\\${CACHE_HASH}\\\\`;\\n        \\n        let _i = null;\\n\\n        try {\\n            for (const k of Object.keys(sessionStorage)) {\\n                if (k.startsWith(\\\\`twplib-idx:\\\\${T}\\\\`) && k !== _SK) {\\n                    sessionStorage.removeItem(k);\\n                }\\n            }\\n        } catch (e) {}\\n\\n        const fi = async () => {\\n            if (_i) return _i;\\n\\n            try {\\n                const c = sessionStorage.getItem(_SK);\\n                if (c) {\\n                    const j = JSON.parse(c);\\n                    if (j?.data) {\\n                        _i = j;\\n                        return _i;\\n                    }\\n                    sessionStorage.removeItem(_SK);\\n                }\\n            } catch (e) {}\\n\\n            const start = parseInt(INDEX_START, 10);\\n            const end = parseInt(INDEX_END, 10);\\n            \\n            const response = await fetch(\\\\`\\\\${T}?_=\\\\${CACHE_HASH}\\\\`, { \\n                headers: { Range: \\\\`bytes=\\\\${start}-\\\\${end}\\\\` },\\n                cache: \\\"no-store\\\"\\n            });\\n            \\n            if (response.status !== 206) {\\n                throw new Error(\\\\`Server does not support Range Requests (got \\\\${response.status})\\\\`);\\n            }\\n            \\n            const j = await response.json();\\n            \\n            try {\\n                sessionStorage.setItem(_SK, JSON.stringify(j));\\n            } catch (e) {}\\n            \\n            _i = j;\\n            return j;\\n        };\\n\\n        const fp = (idx, title) => {\\n            const ti = idx.keys.indexOf('title');\\n            const row = idx.data.find(r => r[ti] === title);\\n            \\n            if (!row) return null;\\n            \\n            return idx.keys.reduce((acc, key, i) => {\\n                if (row[i] != null) acc[key] = row[i];\\n                return acc;\\n            }, {});\\n        };\\n\\n        const tp = (idx) => {\\n            return idx.data.map(row => \\n                idx.keys.reduce((acc, key, i) => {\\n                    if (row[i] != null) acc[key] = row[i];\\n                    return acc;\\n                }, {})\\n            );\\n        };\\n\\n        const sr = (e, status, body) => {\\n            if (!e.source) return;\\n            e.source.postMessage({\\n                verb: 'GET-RESPONSE',\\n                status: String(status),\\n                cookies: e.data.cookies,\\n                url: e.data.url,\\n                type: status === 200 ? 'application/json' : 'text/plain',\\n                body\\n            }, '*');\\n        };\\n\\n        window.addEventListener('message', async (e) => {\\n            if (e.data?.verb !== 'GET') return;\\n            \\n            const u = e.data.url || '';\\n            \\n            if (u === 'recipes/library/tiddlers.json') {\\n                const idx = await fi();\\n                sr(e, 200, JSON.stringify(tp(idx)));\\n                \\n            } else if (u.startsWith('recipes/library/tiddlers/')) {\\n                let enc = u.slice(25);\\n                if (enc.endsWith('.json')) enc = enc.slice(0, -5);\\n                \\n                const title = decodeURIComponent(enc);\\n                const idx = await fi();\\n                const p = fp(idx, title);\\n                \\n                if (!p) return sr(e, 404, 'Not found');\\n                \\n                const response = await fetch(\\\\`\\\\${T}?_=\\\\${CACHE_HASH}\\\\`, { \\n                    headers: { Range: \\\\`bytes=\\\\${p.start}-\\\\${p.end}\\\\` },\\n                    cache: \\\"no-store\\\" \\n                });\\n\\n                const body = await response.text();\\n                \\n                sr(e, 200, body);\\n            } else {\\n                sr(e, 404, 'Not found');\\n            }\\n        });\\n\\n        fi();\\n        parent.postMessage({ verb: 'TWPLIB-READY' }, '*');\\n    `;\\n\\n    const blobHtml = `\u003Cmeta charset=\\\"utf-8\\\">\u003Cscript>\\\\n${handler}\\\\n\u003C${\\\"/\\\"}script>`;\\n\\n    window.stop();\\n    window.location.replace(URL.createObjectURL(\\n        new Blob([blobHtml], { type: \\\"text/html\\\" })\\n    ));\\n})();\",\"type\":\"application/javascript\",\"revision\":\"0\",\"bag\":\"default\"},\"$:/plugins/theophile.dev/http-range-library/library\":{\"text\":\"Plugin library for the http-range-library plugin\",\"caption\":\"http-range-library\",\"url\":\"https://designthinkerer.github.io/http-range-library/?twplib\",\"tags\":\"$:/tags/PluginLibrary\"},\"$:/plugins/theophile.dev/http-range-library/readme\":{\"text\":\"This plugin turn a standard, single-file TiddlyWiki into a self-contained plugin library by appending a byte-offset index to the HTML file, then use that index to make HTTP Range requests fetching only the relevant parts of the library. This is inspired from [[https://github.com/asg017/sqlite-http|https://github.com/asg017/sqlite-http]].\\n\\nThe key parts are located in two tiddlers.\\n\\n!!! 1. [[Saver Hook|$:/plugins/theophile.dev/http-range-library/saver-hook.js]]\\n\\nThis encode the necessary plugins metadata in the wiki upon saving:\\n\\n* Intercepts the save (`renderTiddler`) when generating the final HTML file.\\n* Identifies all plugins in the wiki using the filter in [[$:/plugins/theophile.dev/http-range-library/assetList]] and locates their exact character positions within the tiddler store.\\n* Converts these positions into UTF-8 byte offsets (`start` and `end`) for each plugin's JSON payload using a zero-allocation byte counter.\\n* Compiles the metadata and offsets into a ''compact columnar index format (''`version`, `keys`, and `data` rows) to eliminate redundant property name strings and shrink the index payload. \\n* Appends this index as a JSON script block to the very end of the HTML file, avoiding to create a byte offset.\\n* Calculates the exact start and end byte coordinates of that index block, generates a dynamic 13-digit timestamp (`CACHE_HASH`). The offsets are padded into a 10-digit strings, and the three variables (`INDEX_START`, `INDEX_END`, `CACHE_HASH`) are injected into the bootstrap script at the top of the file ''before'' final assembly.\\n\\n!!! 2. [[Bootstrap Script|$:/plugins/theophile.dev/http-range-library/bootstrap.js]]\\n\\nThis handle the communication with other wikis when used as a library:\\n\\n* When a client TiddlyWiki attempts to load the library in an hidden iframe, the injected bootstrap script detects the `?twplib=1` URL parameter. This url parameter is used to allow the plugin library to be displayed as a normal wiki in an iframe.\\n* To prevent the browser from downloading the entire heavy HTML file, `window.stop()` is executed and the iframe is navigated to an in-memory Blob containing a message handler. This is done to make an `onload` event fires so the parent TiddlyWiki knows the library is ready.\\n* The message handler checks the browser's `sessionStorage` using a scoped, version-hashed key (`twplib-idx:\u003CURL>:\u003CCACHE_HASH>`). If a valid cached columnar index exists, it loads instantly from memory.\\n* If no valid cache exists, the pre-baked start and end byte coordinates allow the handler to immediately issue a bounded HTTP Range request to download the index, automatically purging any stale cache entries from previous saves. It then send the list of available plugins to the client wiki.\\n* When the user clicks \\\"install\\\" on a specific plugin, the message handler looks up the plugin's exact byte offsets in the columnar index and performs a bounded HTTP Range request to fetch and return the JSON data for that specific plugin.\"},\"$:/plugins/theophile.dev/http-range-library/saver-hook.js\":{\"text\":\"exports.name = \\\"twplib-saver-hook\\\";\\nexports.platforms = [\\\"browser\\\", \\\"node\\\"];\\nexports.after = [\\\"startup\\\"];\\nexports.before = [\\\"commands\\\"];\\nexports.synchronous = true;\\n\\nexports.startup = () => {\\n    const { wiki } = $tw;\\n    const original = wiki.renderTiddler.bind(wiki);\\n\\n    // Using rest parameters to safely pass all arguments down\\n    wiki.renderTiddler = function(outputType, templateTitle, ...rest) {\\n        const result = original(outputType, templateTitle, ...rest);\\n        \\n        const templateContent = wiki.getTiddlerText(\\n            \\\"$:/config/SaveWikiButton/Template\\\",\\n            \\\"$:/core/save/all\\\"\\n        );\\n        const saveTemplate = (templateContent || \\\"$:/core/save/all\\\").trim();\\n\\n        if (templateTitle === saveTemplate) {\\n            try {\\n                return addLibraryData(result);\\n            } catch (e) {\\n                console.error(\\\"[twplib] saver hook failed:\\\", e.message, e.stack);\\n            }\\n        }\\n        return result;\\n    };\\n\\n    const addLibraryData = (html) => {\\n        const getUtf8ByteLength = (str, start, end) => {\\n            let len = 0;\\n            for (let i = start; i \u003C end; i++) {\\n                const code = str.charCodeAt(i);\\n                if (code \u003C 0x0080) {\\n                    len += 1;\\n                } else if (code \u003C 0x0800) {\\n                    len += 2;\\n                } else if (code >= 0xD800 && code \u003C= 0xDFFF) {\\n                    len += 4;\\n                    i++;\\n                } else {\\n                    len += 3;\\n                }\\n            }\\n            return len;\\n        };\\n\\n        const getFullLength = (str) => getUtf8ByteLength(str, 0, str.length);\\n\\n        // 1. Prepare bootstrap tag, but DO NOT inject it into the HTML yet.\\n        const bootstrap = wiki.getTiddlerText(\\n            \\\"$:/plugins/theophile.dev/http-range-library/bootstrap.js\\\", \\n            \\\"\\\"\\n        );\\n        const headIdx = html.indexOf(\\\"\u003Chead\\\");\\n        if (headIdx === -1) return html;\\n\\n        const insertAt = html.indexOf(\\\">\\\", headIdx) + 1;\\n        const tag = `\\\\n\u003Cscript id=\\\"twplib-bootstrap\\\">${bootstrap}\u003C/script>\\\\n`;\\n        const tagByteLen = getFullLength(tag);\\n\\n        // 2. Get plugin titles from the assetList filter\\n        const filterStr = wiki.getTiddlerText(\\n            \\\"$:/plugins/theophile.dev/http-range-library/assetList\\\", \\n            \\\"\\\"\\n        ).trim() || \\\"[has[plugin-type]type[application/json]]\\\";\\n        const titles = wiki.filterTiddlers(filterStr);\\n\\n        // Generate a 13-character timestamp for cache busting\\n        const cacheHash = String(Date.now()).padStart(13, \\\"0\\\");\\n\\n        // Build empty columnar index if no plugins match the filter\\n        if (titles.length === 0) {\\n            const empty = JSON.stringify({ version: 1, keys: [], data: [] });\\n            const scriptOpenEmpty = `\\\\n\u003Cscript type=\\\"application/json\\\">\\\\n`;\\n            const emptyStart = getFullLength(html) + tagByteLen + getFullLength(scriptOpenEmpty);\\n            const emptyEnd = emptyStart + getFullLength(empty) - 1;\\n            \\n            const modTagEmpty = tag\\n                .replace(\\\"0000000000\\\", String(emptyStart).padStart(10, \\\"0\\\"))\\n                .replace(\\\"0000000000\\\", String(emptyEnd).padStart(10, \\\"0\\\"))\\n                .replace(\\\"0000000000000\\\", cacheHash);\\n            \\n            return `${html.slice(0, insertAt)}${modTagEmpty}${html.slice(insertAt)}${scriptOpenEmpty}${empty}\\\\n\u003C/script>`;\\n        }\\n\\n        // 3. For each plugin, compute its canonical JSON as written in the tiddler store\\n        const pluginData = {};\\n        for (const title of titles) {\\n            const tiddler = wiki.getTiddler(title);\\n            if (!tiddler) continue;\\n            \\n            const fields = tiddler.getFieldStrings();\\n            const json = JSON.stringify(fields).replace(/\u003C/g, \\\"\\\\\\\\u003C\\\");\\n            pluginData[title] = { json, fields };\\n        }\\n\\n        // 4. Find the character position of each plugin in the ORIGINAL HTML\\n        const charRanges = [];\\n        const storeStart = Math.max(0, html.indexOf('class=\\\"tiddlywiki-tiddler-store\\\"'));\\n\\n        for (const [title, { json }] of Object.entries(pluginData)) {\\n            const idx = html.indexOf(json, storeStart);\\n            if (idx === -1) {\\n                console.warn(\\\"[twplib] plugin not found in store, skipping:\\\", title);\\n                continue;\\n            }\\n            charRanges.push({ title, charStart: idx, charEnd: idx + json.length });\\n        }\\n\\n        // 5. Convert character positions to UTF-8 byte positions (single pass)\\n        // flatMap and Set cleanly handle flattening and deduplicating the array\\n        const points = [...new Set([\\n            0, \\n            ...charRanges.flatMap(r => [r.charStart, r.charEnd]), \\n            html.length\\n        ])].sort((a, b) => a - b);\\n\\n        const charToByte = {};\\n        let prevChar = 0;\\n        let prevByte = 0;\\n        \\n        for (const pos of points) {\\n            prevByte += getUtf8ByteLength(html, prevChar, pos);\\n            prevChar = pos;\\n            charToByte[pos] = prevByte;\\n        }\\n\\n        // 6. Build columnar index\\n        const rows = charRanges.map(r => {\\n            const shiftStart = r.charStart >= insertAt ? tagByteLen : 0;\\n            const shiftEnd = r.charEnd >= insertAt ? tagByteLen : 0;\\n\\n            const byteStart = charToByte[r.charStart] + shiftStart;\\n            const byteEnd = charToByte[r.charEnd] - 1 + shiftEnd;\\n\\n            // Object destructuring isolates `text` so we can easily grab the rest of the fields\\n            const { text, ...restFields } = pluginData[r.title].fields;\\n            \\n            return {\\n                ...restFields,\\n                start: byteStart,\\n                end: byteEnd\\n            };\\n        });\\n\\n        // Use Set & flatMap to extract all unique keys across all rows\\n        const keys = [...new Set(rows.flatMap(Object.keys))];\\n\\n        // Nullish coalescing provides a clean fallback to `null` if the key doesn't exist\\n        const data = rows.map(e => keys.map(k => e[k] ?? null));\\n\\n        const indexJson = JSON.stringify({ version: 1, keys, data });\\n\\n        // 7. Calculate index offsets, modify bootstrap tag, and assemble output\\n        const scriptOpen = `\\\\n\u003Cscript type=\\\"application/json\\\">\\\\n`;\\n        const scriptClose = `\\\\n\u003C/script>`;\\n        const htmlByteLen = charToByte[html.length] + tagByteLen;\\n        const indexStart = htmlByteLen + getFullLength(scriptOpen);\\n        const indexEnd = indexStart + getFullLength(indexJson) - 1;\\n\\n        const modifiedTag = tag\\n            .replace(\\\"0000000000\\\", String(indexStart).padStart(10, \\\"0\\\"))\\n            .replace(\\\"0000000000\\\", String(indexEnd).padStart(10, \\\"0\\\"))\\n            .replace(\\\"0000000000000\\\", cacheHash); // Inject cache hash\\n                            \\n        return `${html.slice(0, insertAt)}${modifiedTag}${html.slice(insertAt)}${scriptOpen}${indexJson}${scriptClose}`;\\n    };\\n};\",\"type\":\"application/javascript\",\"module-type\":\"startup\",\"revision\":\"0\",\"bag\":\"default\"},\"$:/plugins/theophile.dev/http-range-library/settings\":{\"text\":\"\u003C$action-setfield $tiddler=\\\"$:/plugins/theophile.dev/http-range-library/library\\\" url=`${[{$:/info/url/full}]}$?twplib` />\\n\\n!! Library settings\\n\\n\u003Ctable class=\\\"tc-max-width tc-edit-max-width\\\">\\n\u003Cstyle>@scope{\\n.tc-checkbox{input{width:fit-content}}\\n}\u003C/style>\\n\u003Ctr>\\n\u003Ctd>Name\u003C/td>\u003Ctd>\u003C$edit tag=\\\"input\\\" tiddler=\\\"$:/plugins/theophile.dev/http-range-library/library\\\" field=\\\"caption\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>Url\u003C/td>\u003Ctd>\u003C$edit tag=\\\"input\\\" tiddler=\\\"$:/plugins/theophile.dev/http-range-library/library\\\" field=\\\"url\\\"/>\u003C$checkbox tag=\\\"$:/tags/StartupAction\\\"> Keep in sync with the current url\u003C/$checkbox>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>Description\u003C/td>\u003Ctd>\u003C$edit tag=\\\"textarea\\\" tiddler=\\\"$:/plugins/theophile.dev/http-range-library/library\\\" class=\\\"tc-edit-texteditor\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>[[Plugins|https://tiddlywiki.com/static/Filters.html]]\u003C/td>\u003Ctd>\u003C$edit tag=\\\"textarea\\\" tiddler=\\\"$:/plugins/theophile.dev/http-range-library/assetList\\\" class=\\\"tc-edit-texteditor\\\"/>\\n\u003C/td>\\n\u003C/tr>\\n\u003C/table>\",\"tags\":\"$:/tags/StartupAction\"}}}","core-version":"5.4.1","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.1","description":"Plugin packaged with plugin-maker","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/http-range-library"},
{"created":"20260909050841825","text":"(() => {\n    if (!new URLSearchParams(location.search).has(\"twplib\")) return;\n\n    const targetUrl = location.origin + location.pathname;\n\n    const handler = `\n        \u003C!-- placeholders exactly 10 chars long -->\n        const INDEX_START = '[IDX_STRT]';\n        const INDEX_END = '[IDX__END]';\n        \u003C!-- cache hash placeholder is 13 chars long -->\n        const CACHE_HASH = '[CACHE__HASH]';\n        const T = ${JSON.stringify(targetUrl)};\n        const _SK = \\`twplib-idx:\\${T}:\\${CACHE_HASH}\\`;\n        \n        let _i = null;\n\n        try {\n            for (const k of Object.keys(sessionStorage)) {\n                if (k.startsWith(\\`twplib-idx:\\${T}\\`) && k !== _SK) {\n                    sessionStorage.removeItem(k);\n                }\n            }\n        } catch (e) {}\n\n        const fi = async () => {\n            if (_i) return _i;\n\n            try {\n                const c = sessionStorage.getItem(_SK);\n                if (c) {\n                    const j = JSON.parse(c);\n                    if (j?.data) {\n                        _i = j;\n                        return _i;\n                    }\n                    sessionStorage.removeItem(_SK);\n                }\n            } catch (e) {}\n\n            const start = parseInt(INDEX_START, 10);\n            const end = parseInt(INDEX_END, 10);\n            \n            const response = await fetch(\\`\\${T}?_=\\${CACHE_HASH}\\`, { \n                headers: { Range: \\`bytes=\\${start}-\\${end}\\` },\n                cache: \"no-store\"\n            });\n            \n            if (response.status !== 206) {\n                throw new Error(\\`Server does not support Range Requests (got \\${response.status})\\`);\n            }\n            \n            const j = await response.json();\n            \n            try {\n                sessionStorage.setItem(_SK, JSON.stringify(j));\n            } catch (e) {}\n            \n            _i = j;\n            return j;\n        };\n\n        const fp = (idx, title) => {\n            const ti = idx.keys.indexOf('title');\n            const row = idx.data.find(r => r[ti] === title);\n            \n            if (!row) return null;\n            \n            return idx.keys.reduce((acc, key, i) => {\n                if (row[i] != null) acc[key] = row[i];\n                return acc;\n            }, {});\n        };\n\n        const tp = (idx) => {\n            return idx.data.map(row => \n                idx.keys.reduce((acc, key, i) => {\n                    if (row[i] != null) acc[key] = row[i];\n                    return acc;\n                }, {})\n            );\n        };\n\n        const sr = (e, status, body) => {\n            if (!e.source) return;\n            e.source.postMessage({\n                verb: 'GET-RESPONSE',\n                status: String(status),\n                cookies: e.data.cookies,\n                url: e.data.url,\n                type: status === 200 ? 'application/json' : 'text/plain',\n                body\n            }, '*');\n        };\n\n        window.addEventListener('message', async (e) => {\n            if (e.data?.verb !== 'GET') return;\n            \n            const u = e.data.url || '';\n            \n            if (u === 'recipes/library/tiddlers.json') {\n                const idx = await fi();\n                sr(e, 200, JSON.stringify(tp(idx)));\n                \n            } else if (u.startsWith('recipes/library/tiddlers/')) {\n                let enc = u.slice(25);\n                if (enc.endsWith('.json')) enc = enc.slice(0, -5);\n                \n                const title = decodeURIComponent(enc);\n                const idx = await fi();\n                const p = fp(idx, title);\n                \n                if (!p) return sr(e, 404, 'Not found');\n                \n                const response = await fetch(\\`\\${T}?_=\\${CACHE_HASH}\\`, { \n                    headers: { Range: \\`bytes=\\${p.start}-\\${p.end}\\` },\n                    cache: \"no-store\" \n                });\n\n                const body = await response.text();\n                \n                sr(e, 200, body);\n            } else {\n                sr(e, 404, 'Not found');\n            }\n        });\n\n        fi();\n        parent.postMessage({ verb: 'TWPLIB-READY' }, '*');\n    `;\n\n    const blobHtml = `\u003Cmeta charset=\"utf-8\">\u003Cscript>\\n${handler}\\n\u003C${\"/\"}script>`;\n\n    window.stop();\n    window.location.replace(URL.createObjectURL(\n        new Blob([blobHtml], { type: \"text/html\" })\n    ));\n})();","type":"application/javascript","revision":"0","bag":"default","title":"$:/plugins/theophile.dev/http-range-library/bootstrap.js","modified":"20260909051035711"},
{"created":"20260909044559609","text":"Plugin library for the http-range-library plugin","caption":"http-range-library","url":"https://designthinkerer.github.io/http-range-library/?twplib","tags":"$:/tags/PluginLibrary","title":"$:/plugins/theophile.dev/http-range-library/library","modified":"20260909051256417"},
{"created":"20260909051146279","text":"exports.name = \"twplib-saver-hook\";\nexports.platforms = [\"browser\", \"node\"];\nexports.after = [\"startup\"];\nexports.before = [\"commands\"];\nexports.synchronous = true;\n\nexports.startup = () => {\n    const { wiki } = $tw;\n    const originalRender = wiki.renderTiddler.bind(wiki);\n\n    wiki.renderTiddler = function(outputType, templateTitle, ...rest) {\n        const result = originalRender(outputType, templateTitle, ...rest);\n        const saveTemplate = (wiki.getTiddlerText(\"$:/config/SaveWikiButton/Template\", \"$:/core/save/all\")).trim();\n\n        if (templateTitle === saveTemplate) {\n            try { return addLibraryData(result); } \n            catch (e) { console.error(\"[twplib] saver hook failed:\", e.message, e.stack); }\n        }\n        return result;\n    };\n\n    const addLibraryData = (originalHtml) => {\n        // 1. INJECT FIRST! This naturally shifts all downstream string indices, \n        // completely eliminating the need to calculate shift offsets manually.\n        const bootstrap = wiki.getTiddlerText(\"$:/plugins/theophile.dev/http-range-library/bootstrap.js\", \"\");\n        let html = originalHtml.replace(\"\u003Chead>\", `\u003Chead>\\n${bootstrap}\\n`);\n\n        const getUtf8ByteLength = (str, start, end) => {\n            let len = 0;\n            for (let i = start; i \u003C end; i++) {\n                const code = str.charCodeAt(i);\n                if (code \u003C 0x0080) len += 1;\n                else if (code \u003C 0x0800) len += 2;\n                else if (code >= 0xD800 && code \u003C= 0xDFFF) { len += 4; i++; }\n                else len += 3;\n            }\n            return len;\n        };\n\n        const getFullLength = (str) => getUtf8ByteLength(str, 0, str.length);\n\n        // 2. Get plugins\n        const filterStr = wiki.getTiddlerText(\"$:/plugins/theophile.dev/http-range-library/assetList\", \"\").trim() || \"[has[plugin-type]type[application/json]]\";\n        const titles = wiki.filterTiddlers(filterStr);\n        const cacheHash = String(Date.now()).padStart(13, \"0\");\n\n        const scriptOpen = `\\n\u003Cscript type=\"application/json\">\\n`;\n\n        // If no plugins, replace placeholders and return\n        if (titles.length === 0) {\n            const empty = JSON.stringify({ version: 1, keys: [], data: [] });\n            const emptyStart = getFullLength(html) + getFullLength(scriptOpen);\n            const emptyEnd = emptyStart + getFullLength(empty) - 1;\n            \n            return html\n                .replace(\"[IDX_STRT]\", String(emptyStart).padStart(10, \"0\"))\n                .replace(\"[IDX__END]\", String(emptyEnd).padStart(10, \"0\"))\n                .replace(\"[CACHE_HASH_]\", cacheHash) \n                + `${scriptOpen}${empty}\\n\u003C/script>`;\n        }\n\n        // 3. Compute canonical JSON for each plugin\n        const pluginData = {};\n        for (const title of titles) {\n            const tiddler = wiki.getTiddler(title);\n            if (tiddler) pluginData[title] = { \n                json: JSON.stringify(tiddler.getFieldStrings()).replace(/\u003C/g, \"\\\\u003C\"), \n                fields: tiddler.getFieldStrings() \n            };\n        }\n\n        // 4. Find char positions in the ALREADY-MODIFIED html string\n        const charRanges = [];\n        const storeStart = Math.max(0, html.indexOf('class=\"tiddlywiki-tiddler-store\"'));\n\n        for (const [title, { json }] of Object.entries(pluginData)) {\n            const idx = html.indexOf(json, storeStart);\n            if (idx !== -1) charRanges.push({ title, charStart: idx, charEnd: idx + json.length });\n        }\n\n        // 5. Convert char to byte positions\n        const points = [...new Set([0, ...charRanges.flatMap(r => [r.charStart, r.charEnd]), html.length])].sort((a, b) => a - b);\n        const charToByte = {};\n        let prevChar = 0, prevByte = 0;\n        \n        for (const pos of points) {\n            prevByte += getUtf8ByteLength(html, prevChar, pos);\n            prevChar = pos;\n            charToByte[pos] = prevByte;\n        }\n\n        // 6. Build columnar index (Notice: No `shiftStart` or `shiftEnd` needed!)\n        const rows = charRanges.map(r => {\n            const { text, ...restFields } = pluginData[r.title].fields;\n            return {\n                ...restFields,\n                start: charToByte[r.charStart],\n                end: charToByte[r.charEnd] - 1\n            };\n        });\n\n        const keys = [...new Set(rows.flatMap(Object.keys))];\n        const indexJson = JSON.stringify({ version: 1, keys, data: rows.map(e => keys.map(k => e[k] ?? null)) });\n\n        // 7. Assemble output\n        const indexStart = charToByte[html.length] + getFullLength(scriptOpen);\n        const indexEnd = indexStart + getFullLength(indexJson) - 1;\n\n        return html\n            .replace(\"[IDX_STRT]\", String(indexStart).padStart(10, \"0\"))\n            .replace(\"[IDX__END]\", String(indexEnd).padStart(10, \"0\"))\n            .replace(\"[CACHE__HASH]\", cacheHash) \n            + `${scriptOpen}${indexJson}\\n\u003C/script>`;\n    };\n};","type":"application/javascript","module-type":"startup","revision":"0","bag":"default","title":"$:/plugins/theophile.dev/http-range-library/saver-hook.js","modified":"20260909051221398"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/plugin-maker/history\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/plugin-maker/macros]]\\n\\n\u003C$tiddler tiddler=`$:/state/plugin-maker/infos/${[set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]]}$` >\\n\\n\u003Cp style=\\\"position:relative\\\">\u003C\u003CsetVersionFieldButtons>>\u003C/p>\\n\\n\u003C\u003CversionHistory>>\"},\"$:/plugins/theophile.dev/plugin-maker/license\":{\"text\":\"\u003Cp xmlns:cc=\\\"http://creativecommons.org/ns#\\\" xmlns:dct=\\\"http://purl.org/dc/terms/\\\">\u003Ca property=\\\"dct:title\\\" rel=\\\"cc:attributionURL\\\" href=\\\"https://plugin-library.tiddlyhost.com/#%24%3A%2Fplugins%2Ftheophile.dev%2Fplugin-maker\\\">plugin-maker\u003C/a> by \u003Ca rel=\\\"cc:attributionURL dct:creator\\\" property=\\\"cc:attributionName\\\" href=\\\"https://theophile.dev\\\">Théophile Desmedt\u003C/a> is marked with \u003Ca href=\\\"https://creativecommons.org/publicdomain/zero/1.0/?ref=chooser-v1\\\" target=\\\"_blank\\\" rel=\\\"license noopener noreferrer\\\" style=\\\"display:inline-block;\\\">CC0 1.0\u003Cimg style=\\\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\\\" src=\\\"https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1\\\" alt=\\\"\\\">\u003Cimg style=\\\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\\\" src=\\\"https://mirrors.creativecommons.org/presskit/icons/zero.svg?ref=chooser-v1\\\" alt=\\\"\\\">\u003C/a>\u003C/p>  \"},\"$:/plugins/theophile.dev/plugin-maker/macros\":{\"text\":\"\\\\procedure json-tiddler() \\\"{{!!title}}\\\":\u003C$jsontiddler tiddler={{!!title}} exclude=`created creator modified modifier title`/>\\n\\n\\\\procedure json-plugin() {\\\"tiddlers\\\":{\u003C$list filter=\\\"[subfilter\u003Cplugin-filter>]\\\" join=\\\",\\\">\u003C\u003Cjson-tiddler>>\u003C/$list>}}\\n\\n\\\\procedure package-plugin-action()\\n\u003C$wikify name=\\\"json\\\" text=\u003C\u003Cjson-plugin>> >\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cplugin-title>>/>\\n\u003C$genesis \\n  $type=\\\"$action-createtiddler\\\"\\n  $names=\\\"\\n  =[[$overwrite]]\\n  =[[$timestamp]]\\n  =[[text]]\\n  =[[core-version]]\\n  =[[type]]\\n  =[\u003Cplugin-title>!is[blank]then[$basetitle]]\\n  =[\u003Cplugin-author>!is[blank]then[author]]\\n  =[\u003Cplugin-list>!is[blank]then[list]]\\n  =[\u003Cplugin-version>!is[blank]then[version]]\\n  =[\u003Cplugin-description>!is[blank]then[description]]\\n  =[\u003Cplugin-type>!is[blank]then[plugin-type]]\\n  =[\u003Cplugin-stability>!is[blank]then[stability]]\\n  =[\u003Cplugin-parent>!is[blank]then[parent-plugin]]\\n  =[\u003Cplugin-dependents>!is[blank]then[dependents]]\\n  \\\"\\n$values=\\\"\\n  =[[yes]]\\n  =[[no]]\\n  =[\u003Cjson>]\\n  =[\u003Cversion>]\\n  =[[application/json]]\\n  =[\u003Cplugin-title>!is[blank]]\\n  =[\u003Cplugin-author>!is[blank]]\\n  =[\u003Cplugin-list>!is[blank]]\\n  =[\u003Cplugin-version>!is[blank]]\\n  =[\u003Cplugin-description>!is[blank]]\\n  =[\u003Cplugin-type>!is[blank]]\\n  =[\u003Cplugin-stability>!is[blank]]\\n  =[\u003Cplugin-parent>!is[blank]]\\n  =[\u003Cplugin-dependents>!is[blank]]\\n\\\"/>\\n\u003C$action-deletetiddler $filter=\\\"[subfilter\u003Cplugin-filter>]\\\"/>\\n\u003C/$wikify>\\n\\\\end\\n\\n\\\\procedure export-plugin-action()\\n\u003C$let exporterTemplate=\\\"$:/core/templates/exporters/JsonFile\\\">\\n\u003C$tiddler tiddler=\u003C\u003CexporterTemplate>> >\\n\u003C$action-sendmessage $message=\\\"tm-download-file\\\" $param=\u003C\u003CexporterTemplate>> exportFilter=\u003C\u003Cplugin-title>> filename={{{\\n=[\u003Cplugin-title>]\\n=[\u003Cplugin-version>]\\n+[join[_]]\\n=[\u003CexporterTemplate>get[extension]]\\n+[join[]]\\n}}} type={{{ [\u003CexporterTemplate>get[file-type]] }}} />\\n\u003C/$tiddler>\\n\u003C/$let>\\n\\\\end\\n\\n\\\\procedure create-plugin-tiddler()\\n\u003C$action-createtiddler  $basetitle=`$(plugin-title)$/NewTiddler`>\\n\\t\u003C$action-navigate $to=\u003C\u003CcreateTiddler-title>>/>\\n\\t\u003C$action-sendmessage $message=\\\"tm-edit-tiddler\\\" $param=\u003C\u003CcreateTiddler-title>>/>\\n\u003C/$action-createtiddler>\\n\\\\end\\n\\n\\\\procedure edit-info(info,placeholder,options,default,tag:input,hint,hint-link)\\n\u003C$parameters tiddler=`$:/state/plugin-maker/infos/$(plugin-name)$`>\\n\u003Clabel>\\n\u003Cspan>\\n\u003C$genesis $type={{{ [\u003Chint-link>!is[blank]then[a]else[i]]:filter[\u003Chint>!is[blank]] }}} href=\u003C\u003Chint-link>> title=\u003C\u003Chint>> class=\\\"hint\\\"/>\\n\u003C%if [\u003Cinfo>match[name]]:filter[all[tiddlers+shadows]has[plugin-type]] %>\\n\u003C$tiddler tiddler=\u003C\u003Ctiddler>> >\\n\u003C$select field=\\\"set-plugin-name\\\" default={{!!set-plugin-name}} >\\n\u003Coption disabled value={{!!set-plugin-name}} style=\\\"display:none\\\">Name\u003C/option>\\n\u003Coptgroup label='Plugins'>\\n\u003C$list filter=\\\"[has[plugin-type]author{$:/status/UserName}]:map[trim[$:/plugins/]trim[$:/themes/]trim[$:/languages/]split[/]last[]]\\\" variable=\\\"name\\\">\\n\u003C$genesis $type=\\\"option\\\" value={{{ [\u003Cname>match{!!set-plugin-name}then[]else\u003Cname>] }}} $names=\\\"[\u003Cname>match{!!set-plugin-name}then[disabled title]enlist-input[]]\\\" $values=\\\"=true =[[Plugin selected]]\\\">\\n\u003C\u003Cname>>\\n\u003C/$genesis>\\n\u003C/$list>\\n\u003C/optgroup>\\n\u003C/$select>\\n\u003C/$tiddler>\\n\u003C%else%>\\n\u003C$text text={{{ [\u003Cinfo>sentencecase[]] }}}/>\\n\u003C%endif%>\\n\u003C/span>\\n\u003C%if [\u003Coptions>!is[blank]] %>\\n\u003C$select tiddler=\u003C\u003Ctiddler>> field=`set-plugin-$(info)$` default=\u003C\u003Cdefault>> >\u003C$list filter=\u003C\u003Coptions>> >\u003Coption value={{{ [{!!title}split[:]first[]] }}}>{{{ [{!!title}split[:]last[]] }}}\u003C/option>\u003C/$list>\u003C/$select>\\n\u003C%elseif  [\u003Cinfo>match[version]] %>\\n\u003Cspan>\\n\u003C$tiddler tiddler=\u003C\u003Ctiddler>> >\u003C\u003CsetVersionFieldButtons>>\u003C/$tiddler>\\n\u003C/span>\\n\u003C%else%>\\n\u003C$edit tiddler=\u003C\u003Ctiddler>> field=`set-plugin-$(info)$` placeholder=\u003C\u003Cplaceholder>> default=\u003C\u003Cdefault>> tag=\u003C\u003Ctag>> />\\n\u003C%endif%>\\n\u003C/label>\\n\u003C/$parameters>\\n\\\\end\\n\\n\\\\function set.value(value,default:\\\"\\\") [\u003Cvalue>!is[blank]]:else[\u003Cdefault>] :filter[!is[blank]]\\n\\n\\\\procedure setVersionField()\\n\u003C$let increment={{{ [\u003Cmodifier>match[ctrl]then[-1]else[1]] }}} >\\n\u003C$action-setfield set-plugin-version={{{ [\u003Cdom-data-version>split[.]] :map[\u003Cdom-data-nth>subtract[1]match\u003Cindex>then\u003Cincrement>else[0]add{!!title}compare:number:gteq[0]else[0]]+[join[.]] }}}/>\\n\u003C/$let>\\n\\\\end setVersionField\\n\\n\\\\procedure setVersionFieldButton()\\n\u003C$genesis \\n$type=\\\"button\\\" \\ntype=\\\"button\\\"\\ndata-version=\u003C\u003Cversion>>\\ndata-nth=\u003C\u003Cnth>>\\ntitle={{{ \\\"Breaking changes\\\" \\\"Backward compatible changes\\\" \\\"Bug fixes\\\" +[nth\u003Cnth>] }}}\\n>\u003C\u003CversionPart>>\u003C/$genesis>\\n\\\\end setVersionFieldButton\\n\\n\\\\procedure setVersionFieldButtons()\\n\u003C$let version={{{ [{!!set-plugin-version}!is[blank]else[0.0.0]] }}} >\\n\u003C$eventcatcher selector=\\\"button\\\" $click=\u003C\u003CsetVersionField>> tag=\\\"div\\\">\\n\u003C$list filter=\\\"[\u003Cversion>split[.]]\\\" variable=\\\"versionPart\\\" counter=\\\"nth\\\">\u003C\u003CsetVersionFieldButton>>\u003C/$list>\\n\u003C/$eventcatcher>\\n\u003C$edit class=\\\"tc-edit-texteditor\\\" tag=\\\"textarea\\\" field=`set-plugin-version-$(version)$` placeholder=`$(version)$ release notes`/>\\n\u003C/$let>\\n\\\\end setVersionFieldButtons\\n\\n\\\\procedure editVersionFieldButton(field)\\n\\\\procedure editVersionField()\\n\u003C%if [\u003Cmodifier>match[ctrl]] %>\\n\u003C$action-deletefield $field=\u003C\u003Cfield>> />\\n\u003C%else%>\\n\u003C$action-setfield set-plugin-version=\u003C\u003Cversion>> />\\n\u003C%endif%>\\n\\\\end editVersionField\\n\u003C$let version={{{ [\u003Cfield>removeprefix[set-plugin-version-]] }}} >\\n\u003C$button tag=\\\"span\\\" tooltip=\\\"click to edit, ctrl+click to delete\\\" actions=\u003C\u003CeditVersionField>> >\u003Cem>\u003C\u003Cversion>>\u003C/em> - \u003C$text text={{{ [{!!title}get\u003Cfield>] }}}/> \u003C/$button>\\n\u003C/$let>\\n\\\\end editVersionFieldButton\\n\\n\\\\procedure versionHistory()\\n\u003Cul>\\n\u003C$list filter=\\\"[{!!title}fields[]prefix[set-plugin-version-]reverse[]]\\\" variable=\\\"field\\\">\u003Cli>\u003C$transclude $variable=\\\"editVersionFieldButton\\\" field=\u003C\u003Cfield>> />\u003C/li>\u003C/$list>\\n\u003C/ul>\\n\\\\end\\n\\n\\\\function get.destField(subTiddler,field) [\u003CsubTiddler>get\u003Cfield>]\\n\\n\\\\function get.sourceField(subTiddler,field) [\u003CsubTiddler>shadowsource[]get[text]jsonget[tiddlers],\u003CsubTiddler>,\u003Cfield>]\\n\\n\\\\function get.sourceFields(subTiddler) [\u003CsubTiddler>shadowsource[]]:map:flat[\u003CsubTiddler>subtiddlerfields{!!title}]\\n\\n\\\\function has.diff(subTiddler,field) [get.destField\u003CsubTiddler>,\u003Cfield>else[]]:filter[get.sourceField\u003CsubTiddler>,\u003Cfield>else[]!match{!!title}]\\n\\n\\\\function diff.fields(subTiddler) [get.sourceFields\u003CsubTiddler>] [\u003CsubTiddler>fields:exclude[created creator modified modifier title]] :filter[has.diff\u003CsubTiddler>,{!!title}]\\n\\n\\\\procedure subTiddler-list-item()\\n\\\\procedure subTiddler-link()\\n\u003C$link to=\u003C\u003CsubTiddler>> >\\n\u003C%if [\u003CsubTiddler>prefix\u003Cplugin-title>]%>\\n\u003Cspan class=\\\"tc-system-title-prefix\\\">../\u003C/span>\u003C$text text={{{ [\u003CsubTiddler>removeprefix\u003Cplugin-title>trim[/]] }}}/>\\n\u003C%else%>\\n\u003C$text text=\u003C\u003CsubTiddler>> />\\n\u003C%endif%>\\n\u003C/$link>\\n\\\\end subTiddler-link\\n\u003C$let state=`$:/state/peek-tiddler/open/$(subTiddler)$$(qualify)$`>\\n\u003Cli>\\n\u003C\u003CsubTiddler-link>>\\n\u003C%if [diff.fields\u003CsubTiddler>] %>\\n\u003C$checkbox tiddler=\u003C\u003Cstate>> field=\\\"text\\\" checked=\\\"show\\\" class=\\\"tc-btn-invisible\\\">\\n\u003C%if [\u003Cstate>get[text]]%>{{$:/core/images/cancel-button}}\u003C%else%>{{$:/core/images/info-button}}\u003C%endif%>\\n\u003C/$checkbox>\\n\u003C%endif%>\\n\u003C%if [\u003Cstate>get[text]]%>\\n\u003C$list filter=\\\"[diff.fields\u003CsubTiddler>]\\\" variable=field>\\n\u003C$diff-text source={{{ [get.sourceField\u003CsubTiddler>,\u003Cfield>] }}} dest={{{ [get.destField\u003CsubTiddler>,\u003Cfield>] }}} >\\n\u003Ccode>\u003C\u003Cfield>>\u003C/code>: \u003C\u003Cdiff-count>> difference\u003C%if [\u003Cdiff-count>!match[1]]%>s\u003C%endif%>\\n\u003C/$diff-text>\\n\u003C/$list>\\n\u003C%endif%>\\n\u003C/li>\\n\u003C/$let>\\n\\\\end subTiddler-list-item\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/plugin-maker/packager\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/plugin-maker/macros]]\\n\\n\u003Cdiv class=\\\"packager\\\">\\n\u003Cform class=\\\"edit-info\\\">\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"name\\\" tiddler=\\\"$:/state/plugin-maker/infos\\\" placeholder=\\\"Plugin name\\\" hint=\\\"Brief name for the plugin. Select a plugin installed to edit it or write the name of the new plugin to create it\\\"/>\\n\u003C$let plugin-name={{{ [set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]] }}} >\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"author\\\" placeholder=\\\"Author\\\" default={{$:/status/UserName}} hint=\\\"(optional) Author of plugin\\\"/>\\n\u003C$let plugin-author={{{ [set.value{!!set-plugin-author},{$:/status/UserName}] }}} plugin-title=`$:/plugins/$(plugin-author)$/$(plugin-name)$` >\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"description\\\" placeholder=\\\"Plugin description\\\" hint=\\\"Description of plugin\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"version\\\" placeholder=\\\"0.0.1\\\" hint=\\\"(optional) Version string (should conform to SemanticVersioning convention)\\\" hint-link=\\\"https://semver.org/\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"stability\\\" default=\\\"STABILITY_1_EXPERIMENTAL\\\" options=\\\"[[STABILITY_0_DEPRECATED:deprecated]] [[STABILITY_1_EXPERIMENTAL:experimental]] [[STABILITY_2_STABLE:stable]] [[STABILITY_3_LEGACY:legacy]]\\\" hint=\\\"Communicates the state of development of the plugin\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Types\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"type\\\" options=\\\"plugin theme language\\\" default=\\\"plugin\\\" hint=\\\"Determines how the plugin is treated\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Types\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"list\\\" default=\\\"readme\\\" placeholder=\\\"Plugin list\\\" hint=\\\"Names of exposed plugin information tiddlers\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"parent\\\" placeholder=\\\"Plugin parent\\\" hint=\\\"Sub-plugins are displayed in the control panel plugin chooser within the expandable area of their parent plugin\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Dependencies\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"dependents\\\" placeholder=\\\"Plugin dependents\\\" hint=\\\"List the titles of any other plugins that should also be installed\\\"  hint-link=\\\"https://tiddlywiki.com/#Plugin%20Dependencies\\\" tag=\\\"textarea\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"filter\\\" default=\\\"[\u003Cplugin-title>plugintiddlers[]] [prefix\u003Cplugin-title>!\u003Cplugin-title>]\\\" placeholder=\\\"[\u003Cplugin-title>plugintiddlers[]] [prefix\u003Cplugin-title>!\u003Cplugin-title>]\\\" tag=\\\"textarea\\\"  hint=\\\"Filter the tiddlers to package in the plugin. The name of the plugin is stored in the \u003Cplugin-title> variable.\\\"/>\\n\u003C/$let>\\n\u003C/$let>\\n\u003C/form>\\n\\n\u003C$let \\nplugin-name={{{ [set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]] }}}>\\n\u003C$tiddler tiddler=`$:/state/plugin-maker/infos/$(plugin-name)$`>\\n\u003C$let\\nplugin-author={{{ [set.value{!!set-plugin-author},{$:/status/UserName}] }}}\\nplugin-title=`$:/plugins/$(plugin-author)$/$(plugin-name)$`\\nplugin-type={{{ [set.value{!!set-plugin-type},[plugin]] }}}\\nplugin-version={{{ [set.value{!!set-plugin-version},[0.0.1]] }}}\\nplugin-list={{{ [set.value{!!set-plugin-list},[readme]] }}}\\nplugin-description={{{ [set.value{!!set-plugin-description},[Plugin packaged with plugin-maker]] }}}\\nplugin-parent={{{ [set.value{!!set-plugin-parent}] }}}\\nplugin-dependents={{{ [set.value{!!set-plugin-dependents}] }}}\\nplugin-stability={{{ [set.value{!!set-plugin-stability},[STABILITY_1_EXPERIMENTAL]] }}}\\nplugin-filter=`[\u003Cplugin-title>plugintiddlers[]] [all[tiddlers+shadows]prefix\u003Cplugin-title>!\u003Cplugin-title>] ${[set.value{!!set-plugin-filter}]}$ +[sort[title]]`\\nplugin-tiddler-list-pages-max=\\\"20\\\"\\nplugin-tiddler-list-pages={{{ [subfilter\u003Cplugin-filter>is[tiddler]count[]divide\u003Cplugin-tiddler-list-pages-max>add[.5]round[]] }}}\\n>\\n\\n\u003Cp>\u003C$link to=\u003C\u003Cplugin-title>>/>\u003C/p>\\n\\n\u003Cp>\\n//Modified/New tiddlers to be packaged://\\n\u003C/p>\\n\\n\u003C$let skip={{{ [\u003CthisTiddler>get[page]else[0]multiply\u003Cplugin-tiddler-list-pages-max>] }}}>\\n\u003Cul>\\n\u003C$list filter=\\\"[subfilter\u003Cplugin-filter>is[tiddler]butfirst\u003Cskip>limit\u003Cplugin-tiddler-list-pages-max>]\\\" variable=\\\"subTiddler\\\" counter=\\\"counter\\\">\\n\u003Cdiv style=\\\"display:flex;gap:2ch;\\\">\u003C$text text={{{ [{!!page}multiply\u003Cplugin-tiddler-list-pages-max>add\u003Ccounter>] }}} />\u003C$transclude $variable=\\\"subTiddler-list-item\\\"/>\u003C/div>\\n\u003C/$list>\\n\u003C/ul>\\n\u003C/$let>\\n\\n\u003C%if [\u003Cplugin-tiddler-list-pages>compare:number:gt[1]] %>\\n\u003Cspan>\\n\u003C$button disabled={{{  [{!!page}compare:number:gt[0]then[no]else[yes]] }}} set=\\\"!!page\\\" setTo={{{ [{!!page}add[-1]compare:number:gt[0]else[0]] }}}>{{$:/core/images/left-arrow}}\u003C/$button>\\n\u003Cspan>\u003C$text text={{{ [{!!page}add[1]] }}} /> / \u003C\u003Cplugin-tiddler-list-pages>>\u003C/span>\\n\u003C$button disabled={{{ [{!!page}add[1]compare:number:lt\u003Cplugin-tiddler-list-pages>then[no]else[yes]] }}} set=\\\"!!page\\\" setTo={{{ [{!!page}add[1]compare:number:lt\u003Cplugin-tiddler-list-pages>else{!!page}] }}}>{{$:/core/images/right-arrow}}\u003C/$button>\\n\u003C/span>\\n\u003C%endif%>\\n\\n\u003C$button actions=\u003C\u003Ccreate-plugin-tiddler>> >\\n{{$:/core/images/new-button}} \u003C$text text={{$:/language/Buttons/NewTiddler/Caption}}/>\\n\u003C/$button>\\n\\n\u003C$button actions=\u003C\u003Cpackage-plugin-action>> >\\n{{$:/core/images/stamp}} \u003C$text text=`${[\u003Cplugin-title>get[title]then[Update]else[Package]]}$ $(plugin-name)$`/>\\n\u003C/$button>\\n\\n\u003C$button actions=\u003C\u003Cexport-plugin-action>> >\\n{{$:/core/images/input-button}} \u003C$text text=`Export $(plugin-name)$ v$(plugin-version)$`/>\\n\u003C/$button>\\n\\n\u003C/$let>\\n\u003C/$tiddler>\\n\u003C/$let>\\n\u003C/div>\",\"code-body\":\"\"},\"$:/plugins/theophile.dev/plugin-maker/readme\":{\"text\":\"! Minimal Plugin Creator for TiddlyWiki\\n\\nA lightweight tool designed to simplify the process of creating [[TiddlyWiki plugins|https://tiddlywiki.com/#PluginMechanism]]. The goal is to keep it as small and efficient as possible.\\n\\n\\n\u003C\u003C\u003CNote\\nThis plugin is currently in beta. Significant changes are expected before the first official release, and the content may change without prior notice. While it is functional for creating standard plugins, support for themes or language packs has not been tested yet.\\n\u003C\u003C\u003C\\n\\n\\n!! How to Provide Feedback\\n\\nYour feedback is invaluable! If you have suggestions or encounter any issues, please join the discussion on the [[TiddlyWiki Talk forum|https://talk.tiddlywiki.org/t/how-to-create-a-plugin-library-with-one-click-tiddlyhost/11245/3]].\"},\"$:/plugins/theophile.dev/plugin-maker/style\":{\"text\":\".packager {\\n.tc-btn-invisible {\\n  input {\\n    appearance: none;\\n  }\\n\\n  .tc-image-button {\\n    height: 1em;\\n    width: 1em;\\n  }\\n}\\n\\n.edit-info {\\n  --_border: solid 1px;\\n  display: grid;\\n  grid-template-columns: min-content 1fr;\\n  border: var(--_border);\\n\\n  label {\\n    grid-column: 1/-1;\\n    display: grid;\\n    grid-template-columns: subgrid;\\n    position: relative;\\n\\n    &:not(:last-child) {\\n      border-bottom: var(--_border);\\n    }\\n\\n    >span {\\n      gap: .5ch;\\n      padding: 2px;\\n      border-right: var(--_border);\\n      align-content: center;\\n\\n      &:first-of-type {\\n        display: inline-flex;\\n        flex-direction: row-reverse;\\n      }\\n    }\\n\\n    input,\\n    textarea {\\n      resize: vertical;\\n\\n      &.tc-edit-texteditor {\\n        margin: 0;\\n      }\\n    }\\n  }\\n\\n  .hint {\\n    font-style: normal;\\n    text-decoration: none;\\n\\n    &:after {\\n      content: \\\"ⓘ\\\";\\n    }\\n  }\\n}\\n}\",\"tags\":\"$:/tags/Stylesheet\",\"type\":\"text/css\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme packager history license","version":"2.0.18","description":"lightweight plugin packager","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/plugin-maker"},

{"title":"$:/themes/tiddlywiki/snowwhite","name":"Snow White","author":"JeremyRuston","core-version":">=5.0.0","plugin-type":"theme","description":"Emphasises individual tiddlers","dependents":"$:/themes/tiddlywiki/vanilla","plugin-priority":"0","version":"5.4.1","type":"application/json","text":"{\"tiddlers\":{\"$:/themes/tiddlywiki/snowwhite/base\":{\"title\":\"$:/themes/tiddlywiki/snowwhite/base\",\"tags\":\"[[$:/tags/Stylesheet]]\",\"text\":\"\\\\define sidebarbreakpoint-minus-one()\\n\u003C$text text={{{ [{$:/themes/tiddlywiki/vanilla/metrics/sidebarbreakpoint}removesuffix[px]subtract[1]addsuffix[px]] ~[{$:/themes/tiddlywiki/vanilla/metrics/sidebarbreakpoint}] }}}/>\\n\\\\end\\n\\n\\\\rules only filteredtranscludeinline transcludeinline macrodef macrocallinline\\n\\n.tc-sidebar-header {\\n\\ttext-shadow: 0 1px 0 \u003C\u003Ccolour sidebar-foreground-shadow>>;\\n}\\n\\n.tc-tiddler-info {\\n\\tbox-shadow: inset 1px 2px 3px rgba(0,0,0,0.1);\\n}\\n\\n@media screen {\\n\\t.tc-tiddler-frame {\\n\\t\\tbox-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);\\n\\t}\\n}\\n\\n@media (max-width: \u003C\u003Csidebarbreakpoint-minus-one>>) {\\n\\t.tc-tiddler-frame {\\n\\t\\tbox-shadow: none;\\n\\t}\\n}\\n\\n.tc-page-controls button svg, .tc-tiddler-controls button svg, .tc-topbar button svg {\\n\\ttransition: fill 150ms ease-in-out;\\n}\\n\\n.tc-tiddler-controls button.tc-selected,\\n.tc-page-controls button.tc-selected {\\n\\tfilter: drop-shadow(0px -1px 2px rgba(0,0,0,0.25));\\n}\\n\\n.tc-tiddler-frame input.tc-edit-texteditor,\\n.tc-tiddler-frame select.tc-edit-texteditor {\\n\\tbox-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.15);\\n}\\n\\n.tc-edit-tags {\\n\\tbox-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.15);\\n}\\n\\n.tc-tiddler-frame .tc-edit-tags input.tc-edit-texteditor {\\n\\tbox-shadow: none;\\n\\tborder: none;\\n\\toutline: none;\\n}\\n\\ntextarea.tc-edit-texteditor {\\n\\tfont-family: {{$:/themes/tiddlywiki/vanilla/settings/editorfontfamily}};\\n}\\n\\ncanvas.tc-edit-bitmapeditor  {\\n\\tbox-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);\\n}\\n\\n.tc-drop-down {\\n\\tborder-radius: 4px;\\n\\tbox-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);\\n}\\n\\n.tc-block-dropdown {\\n\\tborder-radius: 4px;\\n\\tbox-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);\\n}\\n\\n.tc-modal {\\n\\tborder-radius: 6px;\\n\\tbox-shadow: 0 3px 7px rgba(0,0,0,0.3);\\n}\\n\\n.tc-modal-footer {\\n\\tborder-radius: 0 0 6px 6px;\\n\\tbox-shadow: inset 0 1px 0 #fff;\\n}\\n\\n\\n.tc-alert {\\n\\tborder-radius: 6px;\\n\\tbox-shadow: 0 3px 7px rgba(0,0,0,0.6);\\n}\\n\\n.tc-notification {\\n\\tborder-radius: 6px;\\n\\tbox-shadow: 0 3px 7px rgba(0,0,0,0.3);\\n\\ttext-shadow: 0 1px 0 rgba(255,255,255, 0.8);\\n}\\n\\n.tc-sidebar-lists .tc-tab-set .tc-tab-divider {\\n\\tborder-top: none;\\n\\theight: 1px;\\n\\tbackground-image: linear-gradient(to right, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 100%); \\n}\\n\\n/* HACK: :dir should be used here. html[dir=\\\"rtl\\\"] rules are used to support browsers released before 2023 */\\n\\nhtml[dir=\\\"rtl\\\"] .tc-sidebar-lists .tc-tab-set .tc-tab-divider {\\n\\tbackground-image: linear-gradient(to left, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 100%);\\n}\\n\\n.tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button {\\n\\tbackground-image: linear-gradient(to right, rgba(0,0,0,0.01) 0%, rgba(0,0,0,0.1) 100%);\\n}\\n\\n.tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button.tc-tab-selected {\\n\\tbackground-image: linear-gradient(to right, rgba(0,0,0,0.05) 0%, rgba(255,255,255,0.05) 100%);\\n}\\n\\nhtml[dir=\\\"rtl\\\"] .tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button {\\n    background-image: linear-gradient(to right, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.01) 100%);\\n}\\n\\nhtml[dir=\\\"rtl\\\"] .tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button.tc-tab-selected {\\n    background-image: linear-gradient(to right, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.05) 100%)\\n}\\n\\n.tc-message-box img {\\n\\tbox-shadow: 1px 1px 3px rgba(0,0,0,0.5);\\n}\\n\\n.tc-plugin-info {\\n\\tbox-shadow: 1px 1px 3px rgba(0,0,0,0.5)\\n}\\n\"}}}"},
{"title":"$:/themes/tiddlywiki/vanilla","name":"Vanilla","author":"JeremyRuston","core-version":">=5.0.0","plugin-type":"theme","description":"Basic theme","plugin-priority":"0","version":"5.4.1","dependents":"","type":"application/json","text":"{\"tiddlers\":{\"$:/themes/tiddlywiki/vanilla/themetweaks\":{\"title\":\"$:/themes/tiddlywiki/vanilla/themetweaks\",\"tags\":\"$:/tags/ControlPanel/Appearance\",\"caption\":\"{{$:/language/ThemeTweaks/ThemeTweaks}}\",\"text\":\"\\\\define lingo-base() $:/language/ThemeTweaks/\\n\\n\\\\define replacement-text()\\n[img[$(imageTitle)$]]\\n\\\\end\\n\\n\\\\define backgroundimage-dropdown()\\n\u003Cdiv class=\\\"tc-drop-down-wrapper\\\">\\n\u003C$set name=\\\"state\\\" value=\u003C\u003Cqualify \\\"$:/state/popup/themetweaks/backgroundimage\\\">>>\\n\u003C$button popup=\u003C\u003Cstate>> class=\\\"tc-btn-invisible tc-btn-dropdown\\\">{{$:/core/images/down-arrow}}\u003C/$button>\\n\u003C$reveal state=\u003C\u003Cstate>> type=\\\"popup\\\" position=\\\"belowleft\\\" text=\\\"\\\" default=\\\"\\\" class=\\\"tc-popup-keep\\\">\\n\u003Cdiv class=\\\"tc-drop-down\\\" style=\\\"text-align:center;\\\">\\n\u003C$macrocall $name=\\\"image-picker\\\" actions=\\\"\\\"\\\"\\n\\n\u003C$action-setfield\\n\\t$tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimage\\\"\\n\\t$value=\u003C\u003CimageTitle>>\\n/>\\n\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cstate>>/>\\n\\n\\\"\\\"\\\"/>\\n\u003C/div>\\n\u003C/$reveal>\\n\u003C/$set>\\n\u003C/div>\\n\\\\end\\n\\n\\\\define backgroundimageattachment-dropdown()\\n\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimageattachment\\\" default=\\\"scroll\\\">\\n\u003Coption value=\\\"scroll\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment/Scroll>>\u003C/option>\\n\u003Coption value=\\\"fixed\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment/Fixed>>\u003C/option>\\n\u003C/$select>\\n\\\\end\\n\\n\\\\define backgroundimagesize-dropdown()\\n\u003C$sel 03C\u003Ccolour primary>>;\\n\\toutline-offset: -2px;\\n\\tborder-radius: 0.25em;\\n}\\n\\n/*\\n** Button default styles. Makes them look consistent for all browsers\\n*/\\nhtml button {\\n\\tline-height: 1.2;\\n\\tcolor: \u003C\u003Ccolour button-foreground>>;\\n\\tfill: \u003C\u003Ccolour button-foreground>>;\\n\\tbackground: \u003C\u003Ccolour button-background>>;\\n\\tborder-color: \u003C\u003Ccolour button-border>>;\\n\\tcursor: pointer;\\n}\\n\\nbutton:disabled {\\n\\tcursor: default;\\n\\tcolor: \u003C\u003Ccolour muted-foreground>>;\\n}\\n\\nbutton:disabled svg {\\n\\tfill: \u003C\u003Ccolour muted-foreground>>;\\n}\\n\\n/*\\n** Basic element styles\\n*/\\n\\nhtml, body {\\n\\tfont-family: {{$:/themes/tiddlywiki/vanilla/settings/fontfamily}};\\n\\ttext-rendering: optimizeLegibility; /* Enables kerning and ligatures etc. */\\n\\t-webkit-font-smoothing: antialiased;\\n\\t-moz-osx-font-smoothing: grayscale;\\n}\\n\\nhtml:-webkit-full-screen {\\n\\tbackground-color: \u003C\u003Ccolour page-background>>;\\n}\\n\\nbody.tc-body {\\n\\tfont-size: {{$:/themes/tiddlywiki/vanilla/metrics/fontsize}};\\n\\tline-height: {{$:/themes/tiddlywiki/vanilla/metrics/lineheight}};\\n\\tword-wrap: break-word;\\n\\t\u003C\u003Ccustom-background-datauri>>\\n\\tcolor: \u003C\u003Ccolour foreground>>;\\n\\tbackground-color: \u003C\u003Ccolour page-background>>;\\n\\tfill: \u003C\u003Ccolour foreground>>;\\n}\\n\\n\u003C\u003Cif-background-attachment \\\"\\\"\\\"\\n\\nbody.tc-body {\\n\\tbackground-color: transparent;\\n}\\n\\n\\\"\\\"\\\">>\\n\\n/**\\n * Correct the font size and margin on `h1` elements within `section` and\\n * `article` contexts in Chrome, Firefox, and Safari.\\n */\\n\\nh1 {\\n\\tfont-size: 2em;\\n}\\n\\nh1, h2, h3, h4, h5, h6 {\\n\\tline-height: 1.2;\\n\\tfont-weight: normal;\\n}\\n\\npre {\\n\\tdisplay: block;\\n\\tmargin-top: 1em;\\n\\tmargin-bottom: 1em;\\n\\tword-break: normal;\\n\\tword-wrap: break-word;\\n\\twhite-space: {{$:/themes/tiddlywiki/vanilla/options/codewrapping}};\\n\\tbackground-color: \u003C\u003Ccolour pre-background>>;\\n\\tborder: 1px solid \u003C\u003Ccolour pre-border>>;\\n\\tpadding: 0 3px 2px;\\n\\tborder-radius: 3px;\\n\\tfont-family: {{$:/themes/tiddlywiki/vanilla/settings/codefontfamily}};\\n}\\n\\ncode {\\n\\tcolor: \u003C\u003Ccolour code-foreground>>;\\n\\tbackground-color: \u003C\u003Ccolour code-background>>;\\n\\tborder: 1px solid \u003C\u003Ccolour code-border>>;\\n\\twhite-space: pre-wrap;\\n\\tpadding: 0 3px 2px;\\n\\tborder-radius: 3px;\\n\\tfont-family: {{$:/themes/tiddlywiki/vanilla/settings/codefontfamily}};\\n}\\n\\nblockquote {\\n\\tborder-inline-start: 5px solid \u003C\u003Ccolour blockquote-bar>>;\\n\\t\u003C\u003Cmargin-start 25px>>\\n\\t\u003C\u003Cpadding-start 10px>>\\n\\tquotes: \\\"\\\\201C\\\"\\\"\\\\201D\\\"\\\"\\\\2018\\\"\\\"\\\\2019\\\";\\n}\\n\\nblockquote > div {\\n\\tmargin-top: 1em;\\n\\tmargin-bottom: 1em;\\n}\\n\\nblockquote.tc-big-quote {\\n\\tfont-family: Georgia, serif;\\n\\tposition: relative;\\n\\tbackground: \u003C\u003Ccolour pre-background>>;\\n\\tborder-inline-start: none;\\n\\t\u003C\u003Cmargin-inline 50px>>\\n\\tpadding: 10px;\\n\\tborder-radius: 8px;\\n}\\n\\nblockquote.tc-big-quote cite:before {\\n\\tcontent: \\\"\\\\2014 \\\\2009\\\";\\n}\\n\\nblockquote.tc-big-quote:before {\\n\\tfont-family: Georgia, serif;\\n\\tcolor: \u003C\u003Ccolour blockquote-bar>>;\\n\\tcontent: open-quote;\\n\\tfont-size: 8em;\\n\\tline-height: 0.1em;\\n\\tmargin-right: 0.25em;\\n\\tvertical-align: -0.4em;\\n\\tposition: absolute;\\n\\tleft: -50px;\\n\\ttop: 42px;\\n}\\n\\nblockquote.tc-big-quote:after {\\n\\tfont-family: Georgia, serif;\\n\\tcolor: \u003C\u003Ccolour blockquote-bar>>;\\n\\tcontent: close-quote;\\n\\tfont-size: 8em;\\n\\tline-height: 0.1em;\\n\\tmargin-right: 0.25em;\\n\\tvertical-align: -0.4em;\\n\\tposition: absolute;\\n\\tright: -80px;\\n\\tbottom: -20px;\\n}\\n\\ndl dt {\\n\\tfont-weight: bold;\\n\\tmargin-top: 6px;\\n}\\n\\ntextarea,\\ninput[type=text ncode,\\nkbd,\\nsamp,\\npre {\\n\\tfont-family:\\n\\t\\tui-monospace,\\n\\t\\tSFMono-Regular,\\n\\t\\tConsolas,\\n\\t\\t'Liberation Mono',\\n\\t\\tMenlo,\\n\\t\\tmonospace; /* 1 */\\n\\tfont-size: 1em; /* 2 */\\n}\\n\\n/**\\nAdd the correct font size in all browsers.\\n*/\\n\\nsmall {\\n\\tfont-size: 80%;\\n}\\n\\n/**\\nPrevent 'sub' and 'sup' elements from affecting the line height in all browsers.\\n*/\\n\\nsub,\\nsup {\\n\\tfont-size: 75%;\\n\\tline-height: 0;\\n\\tposition: relative;\\n\\tvertical-align: baseline;\\n}\\n\\nsub {\\n\\tbottom: -0.25em;\\n}\\n\\nsup {\\n\\ttop: -0.5em;\\n}\\n\\n/*\\nTabular data\\n============\\n*/\\n\\n/**\\n1. Remove text indentation from table contents in Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=999088, https://bugs.webkit.org/show_bug.cgi?id=201297)\\n2. Correct table border color inheritance in Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=935729, https://bugs.webkit.org/show_bug.cgi?id=195016)\\n*/\\n\\ntable {\\n\\ttext-indent: 0; /* 1 */\\n\\tborder-color: inherit; /* 2 */\\n}\\n\\n/*\\nForms\\n=====\\n*/\\n\\n/**\\n1. Change the font styles in all browsers.\\n2. Remove the margin in Firefox and Safari.\\n*/\\n\\nbutton,\\ninput,\\noptgroup,\\nselect,\\ntextarea {\\n\\tfont-family: inherit; /* 1 */\\n\\tfont-size: 100%; /* 1 */\\n\\tline-height: 1.15; /* 1 */\\n\\tmargin: 0; /* 2 */\\n}\\n\\n/**\\nRemove the inheritance of text transform in Edge and Firefox.\\n*/\\n\\nbutton,\\nselect {\\n\\ttext-transform: none;\\n}\\n\\n/**\\nCorrect the inability to style clickable types in iOS and Safari.\\n*/\\n\\nbutton,\\n[type='button'],\\n[type='reset'],\\n[type='submit'] {\\n\\t-webkit-appearance: button;\\n}\\n\\n/**\\nRemove the inner border and padding in Firefox.\\n*/\\n\\n::-moz-focus-inner {\\n\\tborder-style: none;\\n\\tpadding: 0;\\n}\\n\\n/**\\nRestore the focus styles unset by the previous rule.\\n*/\\n\\n:-moz-focusring {\\n\\toutline: 1px dotted ButtonText;\\n}\\n\\n/**\\nRemove the additional ':invalid' styles in Firefox.\\nSee: https://github.com/mozilla/gecko-dev/blob/2f9eacd9d3d995c937b4251a5557d95d494c9be1/layout/style/res/forms.css#L728-L737\\n*/\\n\\n:-moz-ui-invalid {\\n\\tbox-shadow: none;\\n}\\n\\n/**\\nRemove the padding so developers are not caught out when they zero out 'fieldset' elements in all browsers.\\n*/\\n\\nlegend {\\n\\tpadding: 0;\\n}\\n\\n/**\\nAdd the correct vertical alignment in Chrome and Firefox.\\n*/\\n\\nprogress {\\n\\tvertical-align: baseline;\\n}\\n\\n/**\\nCorrect the cursor style of increment and decrement buttons in Safari.\\n*/\\n\\n::-webkit-inner-spin-button,\\n::-webkit-outer-spin-button {\\n\\theight: auto;\\n}\\n\\n/**\\n1. Correct the odd appearance in Chrome and Safari.\\n2. Correct the outline style in Safari.\\n*/\\n\\n[type='search'] {\\n\\t-webkit-appearance: textfield; /* 1 */\\n\\toutline-offset: -2px; /* 2 */\\n}\\n\\n/**\\nRemove the inner padding in Chrome and Safari on macOS.\\n*/\\n\\n::-webkit-search-decoration {\\n\\t-webkit-appearance: none;\\n}\\n\\n/**\\n1. Correct the inability to style clickable types in iOS and Safari.\\n2. Change font properties to 'inherit' in Safari.\\n*/\\n\\n::-webkit-file-upload-button {\\n\\t-webkit-appearance: button; /* 1 */\\n\\tfont: inherit; /* 2 */\\n}\\n\\n/*\\nInteractive\\n===========\\n*/\\n\\n/*\\nAdd the correct display in Chrome and Safari.\\n*/\\n\\nsummary {\\n\\tdisplay: list-item;\\n}\\n\"},\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\":{\"title\":\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\",\"text\":\"-apple-system, BlinkMacSystemFont, \\\"Segoe UI\\\", \\\"Noto Sans\\\", sans-serif, Helvetica, Arial, \\\"Apple Color Emoji\\\", \\\"Segoe UI Emoji\\\"\"},\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\":{\"title\":\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\",\"text\":\"ui-monospace, \\\"SFMono-Regular\\\", \\\"SF Mono\\\", Menlo, Consolas, \\\"Liberation Mono\\\", monospace\"},\"$:/t
